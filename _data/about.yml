short_bio_title: "Short bio: for programs & press"
short_bio: "Ethan Stirnemann is a Knoxville-based composer and producer studying composition at the University of Tennessee. His music spans chamber works, electronic production in Ableton Live, and scoring for film and games. He performs with the UTK Electroacoustic Ensemble."

approach_label: Approach
approach_headline: ""
approach_text: "A lot of my writing happens in Ableton Live, where acoustic instruments, synthesis, and recorded sound can share the same piece. Whether I’m writing for a piano trio, a film scene, or a game, I’m interested in how music shapes what people feel and notice, and in using technology to get there."

