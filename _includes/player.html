<div class="player{% if include.feature %} player-feature{% endif %}">
  <button class="player-btn" type="button" aria-label="Play {{ include.title | strip_html | escape }}">
    <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5Z"/></svg>
    <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
  </button>
  <div class="player-info">
    <span class="player-title">{{ include.label }}</span>
    <input class="player-range" type="range" min="0" max="1000" value="0" aria-label="Seek in {{ include.title | strip_html | escape }}">
  </div>
  <span class="player-time">0:00 / {% if include.duration and include.duration != "" %}{{ include.duration }}{% else %}0:00{% endif %}</span>
  <audio preload="metadata" src="{{ include.file }}"></audio>
</div>
